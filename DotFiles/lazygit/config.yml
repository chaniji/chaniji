# ~/.config/lazygit/config.yml
# Gruvbox Dark — JetBrains Mono Nerd Font

gui:
  nerdFontsVersion: "3"
  border: "rounded"
  scrollHeight: 5
  scrollPastBottom: false
  mouseEvents: false

  theme:
    # Active panel border → gruvbox yellow
    activeBorderColor:
      - "#d79921"
      - bold
    # Inactive panel border → gruvbox bg3
    inactiveBorderColor:
      - "#665c54"
    # Options text → gruvbox blue
    optionsTextColor:
      - "#458588"
    # Selected line → gruvbox bg1
    selectedLineBgColor:
      - "#3c3836"
    # Selected range → gruvbox bg2
    selectedRangeBgColor:
      - "#504945"
    # Cherry pick → gruvbox purple
    cherryPickedCommitBgColor:
      - "#b16286"
    cherryPickedCommitFgColor:
      - "#ebdbb2"
    # Unstaged changes → gruvbox red
    unstagedChangesColor:
      - "#cc241d"
    # Default fg → gruvbox fg1
    defaultFgColor:
      - "#ebdbb2"
    # Search highlight border → gruvbox orange
    searchingActiveBorderColor:
      - "#d65d0e"
      - bold

git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never --syntax-theme=gruvbox-dark
  commit:
    signOff: false
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --"
