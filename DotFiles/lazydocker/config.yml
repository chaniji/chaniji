# ~/.config/lazydocker/config.yml
# Gruvbox Dark — named colors (hex not supported)

gui:
  border: "rounded"
  wrapMainPanel: true
  sidePanelWidth: 0.333
  mouseEvents: false

  theme:
    # Active border → gruvbox yellow (mapped to yellow)
    activeBorderColor:
      - yellow
      - bold
    # Inactive border → gruvbox bg3 (mapped to black = dark grey in most terminals)
    inactiveBorderColor:
      - white
    # Selected line → gruvbox bg1 (mapped to black)
    selectedLineBgColor:
      - black
    # Options text → gruvbox blue
    optionsTextColor:
      - cyan

  # CPU → yellow, Memory → magenta (gruvbox purple approx)
  stats:
    graphs:
      - caption: CPU (%)
        statPath: DerivedStats.CPUPercentage
        color: yellow
      - caption: Memory (%)
        statPath: DerivedStats.MemoryPercentage
        color: green

logs:
  timestamps: false
  since: "60m"
  tail: ""

commandTemplates:
  dockerCompose: docker compose
